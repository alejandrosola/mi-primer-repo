<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartelera de eventos</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Cartelera de eventos</h1>
      <p>Lo que se viene en el curso</p>
    </header>

    <div class="buscador">
  <input type="text" id="buscador-input" placeholder="Buscar un evento..." />
</div>
    <main>
      <article class="evento">
        <div class="fecha">
          <span class="dia">22</span> <span class="mes">SEP</span>
        </div>
        <div class="info">
          <h2>Curso introductorio de Git</h2>
          <p>16:00 hs · Aula 1</p>
        </div>
      </article>

      <article class="evento">
        <div class="fecha">
          <span class="dia">22</span> <span class="mes">SEP</span>
        </div>
        <div class="info">
          <h2>Armar un repositorio local</h2>
          <p>16:30 hs</p>
        </div>
      </article>

      <article class="evento">
        <div class="fecha">
          <span class="dia">22</span> <span class="mes">SEP</span>
        </div>
        <div class="info">
          <h2>Conectarse a Github</h2>
          <p>17:20 hs</p>
        </div>
      </article>

      <article class="evento">
        <div class="fecha">
          <span class="dia">22</span> <span class="mes">SEP</span>
        </div>
        <div class="info">
          <h2>Manejo de ramas</h2>
          <p>18:20 hs</p>
        </div>
      </article>
    </main>
    <script>
  const buscador = document.getElementById("buscador-input");
  const eventos = document.querySelectorAll(".evento");

  buscador.addEventListener("input", () => {
    const texto = buscador.value.toLowerCase();

    eventos.forEach((evento) => {
      const titulo = evento.querySelector("h2").textContent.toLowerCase();
      evento.style.display = titulo.includes(texto) ? "flex" : "none";
    });
  });
</script>
  </body>
</html>
